let currentContinent = 'all';
let currentCountryKey = 'ukraine';

function renderCountryButtons() {
  const menu = document.getElementById('countryMenu');
  const query = document.getElementById('countrySearchInput').value.toLowerCase();
  menu.innerHTML = '';

  Object.keys(countriesData).forEach(key => {
    const country = countriesData[key];
    const matchesCont = currentContinent === 'all' || country.continent === currentContinent;
    const matchesQuery = country.name.toLowerCase().includes(query);

    if (matchesCont && matchesQuery) {
      const btn = document.createElement('button');
      btn.className = 'country-btn' + (key === currentCountryKey ? ' active' : '');
      btn.innerText = country.name;
      btn.onclick = () => showCountry(key);
      menu.appendChild(btn);
    }
  });
}

function filterContinent(cont, btn) {
  currentContinent = cont;
  document.querySelectorAll('.cont-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderCountryButtons();
}

function filterCountries() {
  renderCountryButtons();
}

function showCountry(countryKey) {
  currentCountryKey = countryKey;
  renderCountryButtons();
  const country = countriesData[countryKey];
  if (!country) return;

  document.getElementById('currentCountryTitle').innerText = country.name;
  document.getElementById('factsCountBadge').innerText = country.facts.length + ' фактів';
  
  const container = document.getElementById('factsContainer');
  container.innerHTML = country.facts.map((f, i) => `<div class="fact-card"><span class="fact-num">${i + 1}.</span> ${f}</div>`).join('');
}

function toggleSearch() {
  const box = document.getElementById("searchBox");
  const list = document.getElementById("langList");
  const isHidden = box.style.display === "none" || box.style.display === "";
  box.style.display = isHidden ? "block" : "none";
  list.style.display = isHidden ? "block" : "none";
  if (isHidden) {
    renderList(languages);
    document.getElementById("langInput").focus();
  }
}

function renderList(items) {
  const list = document.getElementById("langList");
  list.innerHTML = "";
  items.forEach(lang => {
    const div = document.createElement("div");
    div.className = "lang-item";
    div.innerText = lang.name;
    div.onclick = () => {
      const select = document.querySelector(".goog-te-combo");
      if (select) {
        select.value = lang.code;
        select.dispatchEvent(new Event("change"));
      }
      document.getElementById("searchBox").style.display = "none";
      document.getElementById("langList").style.display = "none";
    };
    list.appendChild(div);
  });
}

function filterLangs() {
  const query = document.getElementById("langInput").value.toLowerCase();
  renderList(languages.filter(l => l.name.toLowerCase().includes(query)));
}

function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'uk', autoDisplay: false}, 'google_translate_element');
}
