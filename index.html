<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The World of facts — дивовижні цікавинки про всі країни світу</title>
  <meta name="description" content="The World of facts: велика енциклопедія цікавих фактів про всі країни світу (без Росії), зручний пошук країн та переклад усіма мовами.">
  <meta name="keywords" content="The World of facts, цікаві факти про країни, всі країни світу, факти про Україну, Карпати, географія">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f0f2f5; color: #202124; }
    header { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; padding: 35px 20px 45px; text-align: center; }
    header h1 { margin: 0 0 8px; font-size: 34px; }
    header p { margin: 0 0 12px; font-size: 16px; opacity: 0.92; }
    .global-stats { display: inline-block; background: rgba(255,255,255,0.18); padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; }
    
    .controls { max-width: 850px; margin: -25px auto 20px; background: white; padding: 22px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
    .top-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    
    .lang-btn { background: #1a73e8; color: white; border: none; padding: 12px 22px; border-radius: 24px; font-size: 15px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .lang-btn:hover { background: #1557b0; }
    
    .country-search-wrap { flex: 1; min-width: 240px; display: flex; align-items: center; border: 1px solid #dfe1e5; border-radius: 24px; padding: 8px 16px; box-shadow: 0 1px 6px rgba(32,33,36,0.12); background: #fff; }
    .country-search-wrap input { width: 100%; border: none; outline: none; font-size: 15px; margin-left: 8px; }

    .search-box { display: none; margin-top: 12px; border: 1px solid #dfe1e5; border-radius: 24px; padding: 10px 18px; box-shadow: 0 2px 6px rgba(32,33,36,0.15); }
    .search-box input { width: 100%; border: none; outline: none; font-size: 16px; }
    .lang-list { display: none; max-height: 200px; overflow-y: auto; border: 1px solid #dfe1e5; border-radius: 12px; margin-top: 6px; background: white; }
    .lang-item { padding: 10px 18px; cursor: pointer; border-bottom: 1px solid #f1f1f1; }
    .lang-item:hover { background: #e8f0fe; color: #1a73e8; font-weight: bold; }

    .continents { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #eee; }
    .cont-btn { background: transparent; border: 1px solid #dadce0; padding: 6px 14px; border-radius: 16px; font-size: 13px; cursor: pointer; color: #5f6368; font-weight: 600; }
    .cont-btn:hover, .cont-btn.active { background: #e8f0fe; color: #1a73e8; border-color: #1a73e8; }

    .countries { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; max-height: 180px; overflow-y: auto; padding-right: 4px; }
    .country-btn { background: #f1f3f4; border: none; padding: 9px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .country-btn:hover, .country-btn.active { background: #1a73e8; color: white; }

    .container { max-width: 850px; margin: 0 auto 50px; padding: 0 15px; }
    .country-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 5px; }
    .country-header h2 { margin: 0; font-size: 24px; color: #1a73e8; }
    .facts-count { font-size: 14px; color: #5f6368; font-weight: bold; background: #e8f0fe; padding: 5px 12px; border-radius: 12px; }
    
    .fact-card { background: white; border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); border-left: 5px solid #1a73e8; font-size: 16px; line-height: 1.55; }
    .fact-num { font-weight: bold; color: #1a73e8; margin-right: 8px; }
    
    .goog-te-banner-frame { display: none !important; }
    body { top: 0px !important; }
  </style>
</head>
<body>

<header>
  <h1>🌍 The World of facts</h1>
  <p>Дивовижні цікавинки про країни нашої планети</p>
  <div class="global-stats" id="globalStats">Завантаження бази країн...</div>
</header>

<div class="controls">
  <div class="top-actions">
    <button class="lang-btn" onclick="toggleSearch()">🌐 Обрати мову / Language</button>
    <div class="country-search-wrap">
      <span>🔍</span>
      <input type="text" id="countrySearchInput" onkeyup="filterCountries()" placeholder="Пошук країни (Україна, Японія, Канада...)">
    </div>
  </div>

  <div class="search-box" id="searchBox">
    <input type="text" id="langInput" onkeyup="filterLangs()" placeholder="Пошук мови (English, Español, Deutsch, 日本語)...">
  </div>
  <div class="lang-list" id="langList"></div>

  <div class="continents" id="continentMenu">
    <button class="cont-btn active" onclick="filterContinent('all', this)">Усі країни</button>
    <button class="cont-btn" onclick="filterContinent('europe', this)">Європа</button>
    <button class="cont-btn" onclick="filterContinent('asia', this)">Азія</button>
    <button class="cont-btn" onclick="filterContinent('america', this)">Америка</button>
    <button class="cont-btn" onclick="filterContinent('africa', this)">Африка</button>
    <button class="cont-btn" onclick="filterContinent('oceania', this)">Океанія</button>
  </div>

  <div class="countries" id="countryMenu"></div>
</div>

<div class="container">
  <div class="country-header">
    <h2 id="currentCountryTitle">Оберіть країну</h2>
    <span class="facts-count" id="factsCountBadge">0 фактів</span>
  </div>
  <div id="factsContainer"></div>
</div>

<div id="google_translate_element" style="display:none;"></div>

<script>
  window.countriesData = {};
</script>
<script src="europe.js"></script>
<script src="asia.js"></script>
<script src="america.js"></script>
<script src="africa.js"></script>
<script src="oceania.js"></script>

<script>
const languages = [
  { name: "Українська (Ukrainian)", code: "uk" },
  { name: "English (Англійська)", code: "en" },
  { name: "Español (Іспанська)", code: "es" },
  { name: "Deutsch (Німецька)", code: "de" },
  { name: "Français (Французька)", code: "fr" },
  { name: "Polski (Польська)", code: "pl" },
  { name: "Italiano (Італійська)", code: "it" },
  { name: "Português (Португальська)", code: "pt" },
  { name: "日本語 (Японська)", code: "ja" },
  { name: "한국어 (Корейська)", code: "ko" },
  { name: "中文 (Китайська)", code: "zh-CN" },
  { name: "Türkçe (Турецька)", code: "tr" },
  { name: "العربية (Арабська)", code: "ar" },
  { name: "हिन्दी (Гінді)", code: "hi" },
  { name: "Čeština (Чеська)", code: "cs" },
  { name: "Svenska (Шведська)", code: "sv" },
  { name: "Nederlands (Нідерландська)", code: "nl" },
  { name: "Ελληνικά (Грецька)", code: "el" },
  { name: "עברית (Іврит)", code: "iw" },
  { name: "Tiếng Việt (В'єтнамська)", code: "vi" }
];

let currentContinent = 'all';
let currentCountryKey = '';

function updateStats() {
  const keys = Object.keys(window.countriesData);
  let totalFacts = 0;
  keys.forEach(k => totalFacts += (window.countriesData[k].facts || []).length);
  document.getElementById('globalStats').innerText = `У базі: ${keys.length} країн • ${totalFacts} цікавих фактів`;
  if (keys.length > 0 && !currentCountryKey) {
    showCountry(window.countriesData['ukraine'] ? 'ukraine' : keys[0]);
  }
}

function renderCountryButtons() {
  const menu = document.getElementById('countryMenu');
  const query = document.getElementById('countrySearchInput').value.toLowerCase();
  menu.innerHTML = '';

  Object.keys(window.countriesData).forEach(key => {
    const country = window.countriesData[key];
    const matchesCont = currentContinent === 'all' || country.continent === currentContinent;
    const matchesQuery = country.name.toLowerCase().includes(query);

    if (matchesCont && matchesQuery) {
      const btn = document.createElement('button');
      btn.className = 'country-btn' + (key === currentCountryKey ? ' active' : '');
      btn.innerText = country.name;
      btn.onclick = () => showCountry(key);
      menu.appendChild(btn);
    }
  });
}

function filterContinent(cont, btn) {
  currentContinent = cont;
  document.querySelectorAll('.cont-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderCountryButtons();
}

function filterCountries() {
  renderCountryButtons();
}

function showCountry(countryKey) {
  currentCountryKey = countryKey;
  renderCountryButtons();
  const country = window.countriesData[countryKey];
  if (!country) return;

  document.getElementById('currentCountryTitle').innerText = country.name;
  document.getElementById('factsCountBadge').innerText = country.facts.length + ' фактів';
  
  const container = document.getElementById('factsContainer');
  container.innerHTML = country.facts.map((f, i) => `<div class="fact-card"><span class="fact-num">${i + 1}.</span> ${f}</div>`).join('');
}

function toggleSearch() {
  const box = document.getElementById("searchBox");
  const list = document.getElementById("langList");
  const isHidden = box.style.display === "none" || box.style.display === "";
  box.style.display = isHidden ? "block" : "none";
  list.style.display = isHidden ? "block" : "none";
  if (isHidden) {
    renderList(languages);
    document.getElementById("langInput").focus();
  }
}

function renderList(items) {
  const list = document.getElementById("langList");
  list.innerHTML = "";
  items.forEach(lang => {
    const div = document.createElement("div");
    div.className = "lang-item";
    div.innerText = lang.name;
    div.onclick = () => {
      const select = document.querySelector(".goog-te-combo");
      if (select) {
        select.value = lang.code;
        select.dispatchEvent(new Event("change"));
      }
      document.getElementById("searchBox").style.display = "none";
      document.getElementById("langList").style.display = "none";
    };
    list.appendChild(div);
  });
}

function filterLangs() {
  const query = document.getElementById("langInput").value.toLowerCase();
  renderList(languages.filter(l => l.name.toLowerCase().includes(query)));
}

function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'uk', autoDisplay: false}, 'google_translate_element');
}

updateStats();
</script>
<script>
  var s = document.createElement('script');
  s.src = 'https://trans' + 'late.goo' + 'gle.com/trans' + 'late_a/element.js?cb=googleTranslateElementInit';
  document.body.appendChild(s);
</script>

</body>
</html>
